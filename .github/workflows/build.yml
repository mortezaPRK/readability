name: Build Artifacts

on:
  workflow_call:
    inputs:
      version:
        description: "Version tag for the release (e.g., v0.1.0 or pr-123)"
        required: true
        type: string
      prerelease:
        description: "Whether this is a pre-release"
        required: false
        type: boolean
        default: false
      release_name:
        description: "Name for the release"
        required: false
        type: string
        default: ""
      body:
        description: "Release notes body"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.release_name || inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          body: ${{ inputs.body || format('Release {0}', inputs.version) }}

  build:
    name: Build ${{ matrix.file_name }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            file_name: readability-wasm.tar.gz
          - runner: ubuntu-24.04
            file_name: readability-js.tar.gz
          - runner: ubuntu-24.04
            file_name: readability_linux-x64
          - runner: ubuntu-24.04-arm
            file_name: readability_linux-arm64
          - runner: macos-15-intel
            file_name: readability_macos-x64
          - runner: macos-15
            file_name: readability_macos-arm64
          - runner: windows-2025
            file_name: readability_windows-x64.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - name: Build
        run: make build/${{ matrix.file_name }}
        shell: bash
      - name: Upload to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.release_name || inputs.version }}
          files: build/${{ matrix.file_name }}
          prerelease: ${{ inputs.prerelease }}
